# The committed archive must match the working tree.
#
# dist/neo-linoleum.zip carries its own copies of manifest.json, README.md and
# LICENSE.md, because an installed mod's file list is whatever the archive contained
# and the game's validator wants a top-level manifest.json from every source alike.
# Duplication drifts, so this is the check that catches it: editing manifest.json
# without rebuilding is a stale archive, and a player's installed mod would behave
# like last week's with nothing to say so.
#
# The demo pack is generated from the main repository's own art, so this checks out
# both and builds it first. If that step ever fails, the archive check is SKIPPED
# rather than passed - a green tick for a check that did not run is worse than a red
# one.
name: archive

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the mod
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Check out Neo Angband (for the converter and the source art)
        uses: actions/checkout@v4
        with:
          repository: neostryder/neo-angband
          path: neo-angband

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the demo pack
        id: pack
        working-directory: neo-angband
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @neo-angband/web gen-linoleum-demo
          # The generator writes under public/mods/<modId>, and the mod id is
          # neo-linoleum. This said `linoleum` and so the guard - whose whole job is to
          # make a failed pack build FAIL rather than skip - was itself what failed.
          test -f packages/web/public/mods/neo-linoleum/original-tiles/manifest.txt

      - name: Verify the committed archive is current
        working-directory: mod
        run: node tools/pack.mjs --verify
