# The committed archives must match a fresh conversion of the source art.
#
# dist/ holds seven zips: one per tile pack, plus neo-linoleum-mod.zip carrying
# manifest.json, plugin.js, README.md, LICENSE.md and CREDITS.md. Those five are duplicated
# from the repository root, because an installed mod's file list is whatever its
# archives contained and the game's validator wants a top-level manifest.json from
# every source alike. Duplication drifts, so this is the check that catches it:
# editing manifest.json without rebuilding is a stale archive, and a player's
# installed mod would behave like last week's with nothing to say so.
#
# The packs are converted from the main repository's tilesheets - upstream's own
# art, which is core game data there - so this checks out both and builds them
# first. tools/build-packs.mjs FAILS on missing source art rather than skipping,
# and tools/pack.mjs FAILS if any declared pack has no built directory, so a
# conversion that did not happen cannot reach the verify step as a green tick.
#
# THE GAME IS CHECKED OUT AT ITS DEFAULT BRANCH, UNPINNED, and that is deliberate
# even though it makes this job depend on a repository nobody here controls. The
# archives are a function of the converter, so pinning the converter would make
# "current" mean "current as of whenever this was pinned" - and the one time these
# archives went stale (2026-07-31, when the engine's packages were renamed to
# @rpgm-tools/* and the stamp the converter writes changed with them) it was
# exactly this unpinned checkout that noticed. A local run agreed with a cached
# conversion and said nothing.
#
# The cost is real and worth naming: a push to the GAME can turn this repository
# red on a day nothing here changed. So the job records which commit of the game
# it built against, because "the archives no longer match" is useless without
# "match what".
name: archive

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the mod
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Check out Neo Angband (for the converter and the source art)
        uses: actions/checkout@v4
        with:
          repository: neostryder/neo-angband
          path: neo-angband

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Say which game commit these archives are being checked against
        working-directory: neo-angband
        run: |
          echo "neo-angband $(git rev-parse HEAD) ($(git log -1 --format=%s))" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the converter
        working-directory: neo-angband
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          test -f packages/linoleum/dist/index.js

      # The root build (tsc -b) never generates packages/web/public/tiles - it is
      # gitignored and produced only by packages/web's own build/bundle/dev
      # (packages/web/scripts/sync-tiles.mjs). build-packs.mjs reads original
      # source art from that tree, so a fresh checkout of neo-angband here needs
      # this step explicitly or the converter fails with "source art missing".
      - name: Generate neo-angband's served tile art
        working-directory: neo-angband
        run: pnpm --dir packages/web run sync-tiles

      - name: Convert all six packs
        working-directory: mod
        run: node tools/build-packs.mjs --game ../neo-angband

      # BEFORE the archive check, because a broken plugin is a worse failure than a
      # stale zip and should be the one named first.
      #
      # AFTER the game checkout and its build, though, and that ordering is load
      # bearing: joint.node.test.mjs drives this mod's real plugin.js through the
      # GAME's real fill door (packages/web/src/tile-registry.ts) over the real
      # generated tile art, which is the one place both halves of the seam exist at
      # once. It FAILS rather than skips when the checkout is missing, so this job
      # is where that test actually runs.
      - name: Test the plugin
        working-directory: mod
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Verify the committed archives are current
        working-directory: mod
        run: node tools/pack.mjs --verify
